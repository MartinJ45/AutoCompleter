<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Helper</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="libs/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <script defer src="popup.js"></script>
</head>
<body class="d-flex flex-column justify-content-center popup-container">
    <div class="p-3">
        <h3>Google Docs Assistant</h3>
        <form class="form-container" id="api-form" onsubmit="return false;">
            <label for="api-key">
                <p>Connect your API key to get started</p>
                <p id="current-apikey">Current key: </p>
            </label>
            
            <div class="d-flex flex-column">
                <div class="input-group mb-2">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" class="form-control" placeholder="Enter your API key..." id="api-key" name="api-key" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle_visibility">
                        <i id="toggle_eye" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <p id="error-message" class="fs-6 mb-2">Couldn't verify API key</p>
                <button class="btn btn-primary" id="submit-button" type="submit">Save & Connect</button>
            </div>
        </form>
    </div>
</body>
</html>
