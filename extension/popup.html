<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Helper</title>
    <script defer src="popup.js"></script>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <h2>Google Docs Assistant</h2>
        <form class="form-container" id="api-form" onsubmit="return false;">
            <label for="api-key">
                <p>Please enter your API key</p>
                <p id="current-apikey">Current key: </p>
            </label>
            <p id="error-message">Couldn't verify API key</p>
            <div class="button-container">
                <input class="input-field" type="password" id="api-key" name="api-key" required>
                <button class="submit-button" id="submit-button" type="submit">Enter</button>
            </div>
        </form>
    </div>
</body>
</html>
